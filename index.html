<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5C4B">
<meta name="description" content="Blessed House of Jericho — Digital Care Records concept demo. Fictional data only; not a medical record system.">
<title>Blessed House of Jericho — Digital Care Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B5C4B'/%3E%3Cpath d='M8 16 L16 9 L24 16 V24 H19 V19 H13 V24 H8 Z' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --header:#1B5C4B; --header-deep:#15483B; --accent:#1F7A6B; --accent-soft:#E6F4F1;
  --bg:#F3F4F2; --surface:#fff; --text:#1C2B2A; --muted:#5E6E6B; --soft:#8A9895;
  --border:#E2E6E3; --border2:#C9D0CD;
  --warn:#B45309; --warn-bg:#FEF3C7; --danger:#B91C1C; --danger-bg:#FEE2E2;
  --ok:#047857; --ok-bg:#D1FAE5; --info:#1D4ED8; --info-bg:#DBEAFE;
  --r:14px; --rs:10px; --shadow:0 1px 2px rgba(28,43,42,.05),0 4px 14px rgba(28,43,42,.06);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none}textarea{resize:vertical;min-height:88px}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.02em}h2{font-size:1.05rem;font-weight:600}h3{font-size:.95rem;font-weight:600}
.muted{color:var(--muted)}.soft{color:var(--soft)}.sm{font-size:.8125rem}.xs{font-size:.75rem}
.fw{font-weight:600}.mb-1{margin-bottom:6px}.mb-2{margin-bottom:10px}.mb-3{margin-bottom:14px}.mb-4{margin-bottom:18px}.mt-2{margin-top:10px}.mt-3{margin-top:14px}
.flex{display:flex}.items-c{align-items:center}.just-b{justify-content:space-between}.gap-1{gap:6px}.gap-2{gap:10px}.gap-3{gap:14px}.wrap{flex-wrap:wrap}
.hidden{display:none!important}

/* App shell — Jericho header + horizontal tabs */
#app{min-height:100vh;display:flex;flex-direction:column}
#top{
  background:var(--header);color:#fff;padding:14px 16px 0;padding-top:calc(14px + var(--safe-t));
  position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.brand-title{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.brand-sub{font-size:.78rem;opacity:.85;font-weight:500;margin-top:2px}
#tabs-sc{margin-top:14px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px 12px}
#tabs-sc::-webkit-scrollbar{display:none}
#tabs{display:flex;gap:6px;width:max-content;min-width:100%}
.tab-btn{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;color:rgba(255,255,255,.88);
  font-size:.875rem;font-weight:500;white-space:nowrap;transition:background .15s,color .15s;
}
.tab-btn.active{background:rgba(0,0,0,.28);color:#fff;font-weight:600}
.tab-btn:hover{background:rgba(255,255,255,.1)}
.tab-btn .badge{
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
  padding:0 5px;margin-left:6px;border-radius:999px;background:#F59E0B;color:#1C2B2A;
  font-size:.65rem;font-weight:700;
}

#main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:18px 16px calc(28px + var(--safe-b))}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
.lead{color:var(--muted);font-size:.92rem;max-width:36rem;margin:6px 0 12px}
.role-pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:#fff;border:1px solid var(--border);font-size:.78rem;font-weight:500;color:var(--muted);
}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(226,230,227,.8)}
.card-pad{padding:16px}.card-click{cursor:pointer;text-align:left;width:100%;transition:transform .1s,box-shadow .15s}
.card-click:active{transform:scale(.995)}
.stat{padding:16px 18px;margin-bottom:12px}
.stat-l{font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--soft);text-transform:uppercase}
.stat-v{font-size:2rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0 2px}
.stat-h{font-size:.85rem;color:var(--muted)}
.stat.warn .stat-v{color:var(--warn)}.stat.ok .stat-v{color:var(--ok)}.stat.danger .stat-v{color:var(--danger)}.stat.accent .stat-v{color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;font-weight:600;font-size:.875rem;border:1px solid transparent}
.btn-p{background:var(--header);color:#fff}.btn-p:hover{background:var(--header-deep)}
.btn-s{background:#fff;border-color:var(--border);color:var(--text)}.btn-s:hover{background:#f7f8f7}
.btn-g{background:transparent;color:var(--accent);padding-left:0;padding-right:0}
.btn-sm{padding:7px 11px;font-size:.8125rem;border-radius:8px}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:#FECACA}
.btn-block{width:100%}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;overflow-x:auto}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:.8125rem;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.field{margin-bottom:12px}label.fl{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.req::after{content:" *";color:var(--danger)}
input[type=text],input[type=date],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:10px;background:#fff;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.grid-2{grid-template-columns:1fr}}

.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:.7rem;font-weight:600}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-danger{background:var(--danger-bg);color:var(--danger)}.b-info{background:var(--info-bg);color:var(--info)}
.b-muted{background:#EEF1F0;color:var(--muted)}.b-accent{background:var(--accent-soft);color:var(--accent)}

.rcard{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px}
.rav{width:42px;height:42px;border-radius:999px;background:var(--accent-soft);color:var(--header);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.ri{flex:1;min-width:0}.ri .name{font-weight:600}.ri .meta{font-size:.8rem;color:var(--muted);margin-top:2px}
.chev{color:var(--soft);flex-shrink:0}

.note{padding:14px;margin-bottom:10px}
.note-m{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--muted);margin-bottom:8px}
.note-b{font-size:.9rem;white-space:pre-wrap}.note-f{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.nfl{font-weight:600;color:var(--text)}
.note-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}

.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.confirm{background:var(--ok-bg);border:1px solid #A7F3D0;border-radius:var(--r);padding:16px;margin-bottom:14px}
.confirm h3{color:var(--ok);margin-bottom:6px}.confirm .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#1C2B2A;color:#fff;padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}

#overlay{position:fixed;inset:0;background:rgba(28,43,42,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
#overlay.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b));overflow:auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h h2{font-size:1.05rem}
@media(min-width:720px){
  #overlay{align-items:center;padding:24px}
  .sheet{border-radius:16px;max-height:85vh}
  #main{padding:24px 24px 40px}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stats-grid .stat{margin-bottom:0}
  .desk-2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
}

.footer-note{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);font-size:.75rem;color:var(--soft);text-align:center;line-height:1.5}
.audit{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.audit:last-child{border:none}.adot{width:8px;height:8px;border-radius:999px;background:var(--accent);margin-top:6px;flex-shrink:0}
.atime{font-size:.75rem;color:var(--soft);margin-top:2px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:.875rem}.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--header)}
.banner{background:#FFF8EB;border:1px solid #F5E0B8;color:#7A5A1E;padding:10px 14px;border-radius:10px;font-size:.8rem;margin-bottom:14px}
.prog{height:8px;background:#E8ECEA;border-radius:999px;overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.shift-chip{display:inline-flex;padding:2px 8px;border-radius:6px;background:#EEF1F0;font-size:.72rem;font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand-title">Blessed House of Jericho</div>
    <div class="brand-sub">Digital Care Records — Demo</div>
    <div id="tabs-sc"><nav id="tabs" aria-label="Primary"></nav></div>
  </header>
  <main id="main"><div id="content"></div>
    <p class="footer-note">Concept demonstration for Blessed House of Jericho. All resident information is fictional demo data.
      Not a medical record system · Not for clinical use · No HIPAA claim.
      <button type="button" class="btn btn-g btn-sm" data-action="reset-demo" style="display:inline;margin-left:6px">Reset demo data</button>
    </p>
  </main>
</div>
<div id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" role="status"></div>
<script>
(function(){
"use strict";
const STORE_KEY='bhdc_docs_v2';
const SHIFTS=['Morning','Evening','Night'];
const STAFF=[
  {id:'ann',name:'Ann',role:'Owner',initials:'AN'},
  {id:'harun',name:'Harun',role:'Caregiver',initials:'HA'},
  {id:'loice',name:'Loice',role:'Caregiver',initials:'LO'}
];
const NAV=[
  {id:'dashboard',label:'Dashboard',href:'#/dashboard'},
  {id:'clients',label:'Clients',href:'#/clients'},
  {id:'document-care',label:'Document Care',href:'#/document-care'},
  {id:'daily-notes',label:'Daily Notes',href:'#/daily-notes'},
  {id:'coming-next',label:'Coming next',href:'#/coming-next'}
];

function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDaysISO(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(){return 'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sn(id){const s=STAFF.find(x=>x.id===id);return s?s.name:id}
function srole(id){const s=STAFF.find(x=>x.id===id);return s?s.role:''}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function fmtDate(iso){if(!iso)return '—';const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function fmtTime(ts){return new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function initials(name){return name.split(/\s+/).map(p=>p[0]).join('').slice(0,2).toUpperCase()}
function parseHash(){const h=(location.hash||'#/dashboard').replace(/^#\/?/,'');const [path,qs]=h.split('?');const parts=path.split('/').filter(Boolean);const params={};if(qs)qs.split('&').forEach(p=>{const [k,v]=p.split('=');params[decodeURIComponent(k)]=decodeURIComponent(v||'')});return {parts,params,page:parts[0]||'dashboard'}}
function navigate(h){location.hash=h.startsWith('#')?h:'#/'+h}

function seedClients(){
  return [
    {id:'ew',name:'Eleanor Whitfield',room:'Rm 101',status:'Active',diet:'Regular',mobility:'Walker',allergies:'None known (demo)',notes:'Prefers morning baths. Family visits Sundays.'},
    {id:'hb',name:'Harold Brennan',room:'Rm 102',status:'Active',diet:'Low sodium',mobility:'Independent',allergies:'Penicillin (demo)',notes:'Podiatry follow-up pending.'},
    {id:'mo',name:'Margarethe Olsen',room:'Rm 103',status:'Active',diet:'Nectar-thick liquids',mobility:'One-person assist',allergies:'None known (demo)',notes:'Aspiration risk — upright 30 min after meals.'},
    {id:'sa',name:'Samuel Adeyemi',room:'Rm 104',status:'Active',diet:'Regular / soft preference',mobility:'Cane',allergies:'Shellfish (demo)',notes:'Enjoys music therapy.'},
    {id:'dl',name:'Dorothy Lindgren',room:'Rm 105',status:'Active',diet:'Diabetic',mobility:'Wheelchair short distances',allergies:'Latex (demo)',notes:'Fluid intake to monitor.'},
    {id:'wk',name:'Walter Kowalczyk',room:'Rm 106',status:'Hospital',diet:'—',mobility:'—',allergies:'None known (demo)',notes:'In hospital — documentation paused (demo).'}
  ];
}
function mkNote(partial){
  return Object.assign({
    id:uid(),date:todayISO(),shift:'Morning',authorId:'ann',
    meals:'100% / good appetite',fluid:'Adequate',toileting:'Independent',
    bathing:'AM hygiene completed',mobility:'Independent',meds:'All given as ordered (demo)',
    mood:'Pleasant, engaged',sleep:'n/a',activities:'Lounge / TV',
    narrative:'Routine care completed (demo).',observations:'',
    followUpRequired:false,followUpDetail:'',followUpResolved:false,
    reviewed:false,reviewedBy:null,reviewedAt:null,createdAt:Date.now(),updatedAt:Date.now()
  }, partial);
}
function seedNotes(){
  const t=todayISO(), y=addDaysISO(-1);
  return [
    mkNote({id:'n1',clientId:'ew',date:t,shift:'Morning',authorId:'harun',narrative:'AM care complete. Ate full breakfast. Cheerful (demo).',createdAt:Date.now()-8*60000}),
    mkNote({id:'n2',clientId:'hb',date:t,shift:'Morning',authorId:'loice',narrative:'Morning meds given. Walking in hallway with cane (demo).',createdAt:Date.now()-17*60000}),
    mkNote({id:'n3',clientId:'mo',date:t,shift:'Morning',authorId:'ann',meals:'75% / nectar-thick',narrative:'Breakfast with nectar-thick fluids. Remained upright 30 min (demo).',createdAt:Date.now()-37*60000}),
    mkNote({id:'n4',clientId:'ew',date:t,shift:'Evening',authorId:'harun',narrative:'Evening hygiene done. Watched TV in lounge (demo).',createdAt:Date.now()-3*3600000}),
    mkNote({id:'n5',clientId:'hb',date:y,shift:'Night',authorId:'loice',narrative:'Slept well with one bathroom trip (demo).',sleep:'Slept well · 1 awakening'}),
    mkNote({id:'n6',clientId:'mo',date:y,shift:'Night',authorId:'harun',meals:'n/a (night)',fluid:'Sips offered',followUpRequired:true,followUpDetail:'Recheck cough with thin liquids — nectar-thick only (demo).',narrative:'Night checks uneventful. Mild cough noted earlier with thin liquids — reinforce thickened liquids (demo).'}),
    mkNote({id:'n7',clientId:'sa',date:y,shift:'Evening',authorId:'loice',narrative:'Quiet evening. Declined group activity (demo).'}),
    mkNote({id:'n8',clientId:'dl',date:y,shift:'Night',authorId:'harun',followUpRequired:true,followUpDetail:'Notify physician re: burning with urination / frequency (demo).',toileting:'Assisted · frequency ↑',narrative:'Up to bathroom several times overnight; reports burning. Flag for physician (demo).'}),
    mkNote({id:'n9',clientId:'sa',date:addDaysISO(-2),shift:'Morning',authorId:'ann',narrative:'Routine AM care (demo).',reviewed:true,reviewedBy:'ann',reviewedAt:Date.now()-86400000}),
    mkNote({id:'n10',clientId:'dl',date:addDaysISO(-2),shift:'Evening',authorId:'loice',narrative:'Blood sugar checked per plan (demo value only).',reviewed:true,reviewedBy:'ann',reviewedAt:Date.now()-80000000}),
    mkNote({id:'n11',clientId:'ew',date:addDaysISO(-2),shift:'Night',authorId:'harun',sleep:'Restless early, then settled',narrative:'Night checks OK (demo).'}),
    mkNote({id:'n12',clientId:'hb',date:addDaysISO(-3),shift:'Morning',authorId:'ann',narrative:'Prep for podiatry — shoes ready (demo).'}),
    mkNote({id:'n13',clientId:'mo',date:addDaysISO(-3),shift:'Evening',authorId:'loice',followUpRequired:true,followUpResolved:true,followUpDetail:'Speech therapy consult scheduled (demo).',narrative:'Coughing episode at dinner; thickened liquids reinforced (demo).'}),
    mkNote({id:'n14',clientId:'dl',date:t,shift:'Morning',authorId:'harun',narrative:'AM care. Encouraged fluids. Mood brighter today (demo).',createdAt:Date.now()-50*60000})
  ];
}
function seedAudit(){
  return [
    {id:uid(),at:Date.now()-8*60000,actorId:'harun',text:'Harun documented Morning care for Eleanor Whitfield'},
    {id:uid(),at:Date.now()-17*60000,actorId:'loice',text:'Loice documented Morning care for Harold Brennan'},
    {id:uid(),at:Date.now()-37*60000,actorId:'ann',text:'Ann documented Morning care for Margarethe Olsen'},
    {id:uid(),at:Date.now()-86400000,actorId:'ann',text:'Ann marked a care note reviewed for Samuel Adeyemi'}
  ];
}
function defaultStore(){
  return {version:2,currentUserId:'ann',clients:seedClients(),careNotes:seedNotes(),audit:seedAudit()};
}
let store=null;
function persist(){localStorage.setItem(STORE_KEY,JSON.stringify(store))}
function loadStore(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw){store=defaultStore();persist();return}
    const parsed=JSON.parse(raw);
    if(!parsed||parsed.version!==2||!parsed.clients||!parsed.careNotes){store=defaultStore();persist();return}
    store=parsed;
    if(!store.currentUserId)store.currentUserId='ann';
  }catch(e){store=defaultStore();persist()}
}
function resetStore(){store=defaultStore();persist()}
function addAudit(text){store.audit.unshift({id:uid(),at:Date.now(),actorId:store.currentUserId,text});if(store.audit.length>200)store.audit.length=200}
function getClient(id){return store.clients.find(c=>c.id===id)}
function toast(msg,kind){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(kind?' '+kind:'');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600)}

function expectedShiftsFor(client){
  if(client.status==='Hospital')return [];
  return SHIFTS.slice(); // Morning, Evening, Night expected when in house
}
function notesToday(){const t=todayISO();return store.careNotes.filter(n=>n.date===t)}
function openFollowUps(){return store.careNotes.filter(n=>n.followUpRequired&&!n.followUpResolved)}
function docStats(){
  const t=todayISO();
  const active=store.clients.filter(c=>c.status==='Active');
  let expected=0,done=0;
  const perClient=[];
  active.forEach(c=>{
    const shifts=expectedShiftsFor(c);
    expected+=shifts.length;
    const got=shifts.map(s=>{
      const note=store.careNotes.find(n=>n.clientId===c.id&&n.date===t&&n.shift===s);
      return {shift:s,done:!!note,note};
    });
    done+=got.filter(g=>g.done).length;
    perClient.push({client:c,got,missing:got.filter(g=>!g.done).map(g=>g.shift)});
  });
  return {active:active.length,expected,done,outstanding:expected-done,perClient,notesToday:notesToday().length,followUps:openFollowUps().length,unreviewed:store.careNotes.filter(n=>!n.reviewed).length};
}

function renderNav(){
  const route=parseHash();
  const active=route.page||'dashboard';
  const fu=openFollowUps().length;
  document.getElementById('tabs').innerHTML=NAV.map(item=>{
    let badge='';
    if(item.id==='daily-notes'&&fu)badge='<span class="badge">'+fu+'</span>';

function wireCareForm(){
  const form=document.getElementById('care-form');
  if(!form)return;
  const seg=document.getElementById('cf-shift-seg');
  if(seg)seg.addEventListener('click',e=>{
    const b=e.target.closest('[data-shift]');if(!b)return;
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('cf-shift').value=b.getAttribute('data-shift');
  });
  const fu=document.getElementById('cf-fu');
  const wrap=document.getElementById('cf-fu-wrap');
  if(fu)fu.addEventListener('change',()=>wrap.classList.toggle('hidden',!fu.checked));
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(!form.reportValidity())return;
    const fd=new FormData(form);
    const clientId=fd.get('clientId');
    const c=getClient(clientId);
    const editId=fd.get('editId');
    const payload={
      clientId, date:fd.get('date'), shift:fd.get('shift')||document.getElementById('cf-shift').value,
      authorId:fd.get('authorId'), meals:fd.get('meals'), fluid:fd.get('fluid'), meds:fd.get('meds'),
      toileting:fd.get('toileting'), bathing:fd.get('bathing'), mobility:fd.get('mobility'),
      mood:fd.get('mood'), sleep:fd.get('sleep')||'n/a', activities:fd.get('activities')||'',
      narrative:fd.get('narrative'), observations:fd.get('observations')||'',
      followUpRequired:!!document.getElementById('cf-fu').checked,
      followUpDetail:fd.get('followUpDetail')||'', updatedAt:Date.now()
    };
    if(payload.followUpRequired&&!payload.followUpDetail.trim()){toast('Add follow-up detail','err');return}
    let note;
    if(editId){
      note=store.careNotes.find(n=>n.id===editId);
      if(!note){toast('Note not found','err');return}
      const wasFU=note.followUpRequired&&!note.followUpResolved;
      Object.assign(note,payload);
      if(payload.followUpRequired){if(!wasFU)note.followUpResolved=false}
      else {note.followUpResolved=false;note.followUpDetail=''}
      note.reviewed=false;note.reviewedBy=null;note.reviewedAt=null;
      addAudit(sn(payload.authorId)+' updated care note for '+c.name+' ('+payload.shift+')');
      toast('Care note updated','ok');
    } else {
      note=mkNote(Object.assign({id:uid(),createdAt:Date.now()},payload));
      store.careNotes.unshift(note);
      addAudit(sn(payload.authorId)+' documented '+payload.shift+' care for '+c.name);
      toast('Care note saved','ok');
    }
    persist();
    const confirm=document.getElementById('care-confirm');
    confirm.classList.remove('hidden');
    confirm.innerHTML='<div class="confirm"><h3>Care note saved</h3><p>Documentation for '+esc(c.name)+' · '+esc(note.shift)+' has been recorded'+(note.followUpRequired?' with a follow-up alert':'')+'.</p><div class="links"><button class="btn btn-p btn-sm" type="button" data-nav="#/clients/'+c.id+'?tab=notes">View in '+esc(c.name.split(' ')[0])+'\'s notes</button><button class="btn btn-s btn-sm" type="button" data-nav="#/dashboard">Dashboard</button><button class="btn btn-s btn-sm" type="button" data-nav="#/document-care">Document another</button><button class="btn btn-g btn-sm" type="button" data-nav="#/daily-notes">Daily Notes log</button></div></div>';
    form.classList.add('hidden');
    window.scrollTo({top:0,behavior:'smooth'});
    renderNav();
  });
}

function wireFilters(){
  const btn=document.getElementById('flt-apply');
  if(!btn)return;
  btn.onclick=()=>{
    const p=new URLSearchParams();
    const route=parseHash();
    if(route.params.filter)p.set('filter',route.params.filter);
    const d=document.getElementById('flt-date').value; if(d)p.set('date',d);
    const c=document.getElementById('flt-client').value; if(c)p.set('client',c);
    const s=document.getElementById('flt-shift').value; if(s)p.set('shift',s);
    const st=document.getElementById('flt-staff').value; if(st)p.set('staff',st);
    navigate('#/daily-notes?'+p.toString());
  };
}

function openSheet(title,body){
  const o=document.getElementById('overlay');
  document.getElementById('sheet').innerHTML='<div class="sheet-h"><h2>'+esc(title)+'</h2><button type="button" class="btn btn-s btn-sm" data-action="sheet-cancel">Close</button></div>'+body;
  o.classList.add('open');document.body.style.overflow='hidden';
}
function closeSheet(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';}
function confirmDialog(msg,onYes){
  openSheet('Confirm','<p class="mb-3">'+esc(msg)+'</p><div class="flex gap-2"><button class="btn btn-p" type="button" id="confirm-yes">Yes, continue</button><button class="btn btn-s" type="button" data-action="sheet-cancel">Cancel</button></div>');
  document.getElementById('confirm-yes').onclick=()=>{closeSheet();onYes()};
}

function handleAction(action,el){
  const id=el.getAttribute('data-id');
  switch(action){
    case 'sheet-cancel':closeSheet();break;
    case 'reset-demo':confirmDialog('Reset all demo data to the original seed? Unsaved demo changes will be lost.',()=>{resetStore();toast('Demo data restored','ok');navigate('#/dashboard')});break;
    case 'review-note':{
      if(store.currentUserId!=='ann'){toast('Only Ann (Owner) can mark reviewed','err');return}
      const n=store.careNotes.find(x=>x.id===id);if(!n)return;
      n.reviewed=true;n.reviewedBy='ann';n.reviewedAt=Date.now();
      addAudit('Ann marked a care note reviewed for '+(getClient(n.clientId)||{}).name);
      persist();toast('Marked reviewed','ok');render();break;
    }
    case 'resolve-followup':{
      const n=store.careNotes.find(x=>x.id===id);if(!n)return;
      n.followUpResolved=true;
      addAudit(sn(store.currentUserId)+' resolved a follow-up for '+(getClient(n.clientId)||{}).name);
      persist();toast('Follow-up resolved','ok');render();break;
    }
    case 'edit-note':navigate('#/document-care?edit='+id);break;
  }
}

function render(){
  renderNav();
  const route=parseHash();
  const page=route.page||'dashboard';
  let html='';
  if(page==='dashboard')html=viewDashboard();
  else if(page==='clients'&&route.parts[1])html=viewClientDetail(route);
  else if(page==='clients')html=viewClients(route);
  else if(page==='document-care')html=viewDocumentCare(route);
  else if(page==='daily-notes')html=viewDailyNotes(route);
  else if(page==='coming-next')html=viewComingNext();
  else html=viewDashboard();
  document.getElementById('content').innerHTML=html;
  wireCareForm();wireFilters();
  // scroll to note if requested
  if(route.params.note){const el=document.getElementById('note-'+route.params.note);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
}

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){e.preventDefault();closeSheet();navigate(nav.getAttribute('data-nav'));return}
  const act=e.target.closest('[data-action]');
  if(act){e.preventDefault();handleAction(act.getAttribute('data-action'),act)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='client-search'){
    clearTimeout(window._searchT);
    window._searchT=setTimeout(()=>{
      const q=e.target.value;
      history.replaceState(null,'','#/clients'+(q?'?q='+encodeURIComponent(q):''));
      document.getElementById('content').innerHTML=viewClients(parseHash());
    },150);
  }
});
window.addEventListener('hashchange',render);
loadStore();
if(!location.hash)location.hash='#/dashboard';
else render();
})();
</script>
</body>
</html>
