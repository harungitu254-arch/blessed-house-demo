<title>Blessed House Digital Care</title>

<style>
:root{--bg:#FAF9F7;--surface:#fff;--text:#1F2A2E;--muted:#5A6A70;--soft:#8A969B;--border:#E6E2DC;--border2:#D0CBC3;--accent:#1F5F5B;--accent-soft:#E8F2F1;--accent-h:#174A47;--warn:#B45309;--warn-bg:#FEF3C7;--danger:#B91C1C;--danger-bg:#FEE2E2;--ok:#047857;--ok-bg:#D1FAE5;--info:#1D4ED8;--info-bg:#DBEAFE;--r:8px;--rs:6px;--shadow:0 1px 2px rgba(31,42,46,.06);--shadow-md:0 4px 12px rgba(31,42,46,.08);--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--nav-h:56px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--side:220px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}

a{color:var(--accent);text-decoration:none}svg{display:block;max-width:100%}
h1{font-size:1.05rem;font-weight:600}h2{font-size:.95rem;font-weight:600}h3{font-size:.9rem;font-weight:600}
.app{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{display:none;width:var(--side);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand svg{width:32px;height:32px}.brand-name{font-weight:650;font-size:.9rem}.brand-sub{font-size:.7rem;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rs);color:var(--muted);font-size:.875rem;font-weight:500;min-height:40px;width:100%;text-align:left}
.nav-item:hover{background:var(--bg);color:var(--text)}.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;padding-top:calc(8px + var(--safe-t));display:flex;align-items:center;gap:12px;min-height:52px}
.topbar-title{flex:1;min-width:0}.topbar-title h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{font-size:.75rem;color:var(--muted);margin-top:1px}
.user-sw{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:4px 8px 4px 4px;min-height:40px;font-size:.8rem}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0}
.user-sw select{border:none;background:transparent;font-size:.8rem;font-weight:500;outline:none;max-width:90px;min-height:32px}
.content{flex:1;padding:16px;max-width:1100px;width:100%;margin:0 auto}
.page-foot{padding:16px 16px calc(8px + var(--safe-b));font-size:.7rem;color:var(--soft);line-height:1.45;text-align:center;max-width:1100px;margin:0 auto}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.65rem;font-weight:500;min-height:44px;padding:6px 2px}
.bnav-item.active{color:var(--accent)}.bnav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-pad{padding:14px}.card-click{cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:left;width:100%;display:block;color:inherit}

.tile-l{font-size:.72rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.tile-v{font-size:1.35rem;font-weight:650;line-height:1.1}.tile-h{font-size:.72rem;color:var(--soft)}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}.sec .count{font-size:.75rem;color:var(--muted)}

.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent-h)}
.btn-s{background:var(--surface);border-color:var(--border2);color:var(--text)}.btn-s:hover{background:var(--bg)}
.btn-g{color:var(--muted)}.btn-g:hover{background:var(--bg);color:var(--text)}
.btn-d{background:var(--danger-bg);color:var(--danger)}.btn-sm{padding:6px 10px;font-size:.8rem;min-height:36px}.btn-block{width:100%}
.btn-icon{width:40px;height:40px;padding:0;border-radius:var(--rs);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.btn-icon:hover{background:var(--bg)}.btn-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.fg{margin-bottom:14px}.fl{display:block;font-size:.8rem;font-weight:550;margin-bottom:5px}.fl .req{color:var(--danger)}
.ferr{font-size:.75rem;color:var(--danger);margin-top:4px}

.fc:focus,.fs:focus,.ft:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ft{min-height:88px;resize:vertical}.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fcheck{display:flex;align-items:center;gap:8px;min-height:40px;font-size:.875rem}.fcheck input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;font-size:.8rem;font-weight:500;color:var(--muted);min-height:40px;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}.seg button.active{background:var(--accent);color:#fff}.seg button:hover:not(.active){background:var(--surface);color:var(--text)}
.seg .sc{font-size:.65rem;opacity:.85;margin-left:3px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:550;white-space:nowrap}
.b-stable,.b-closed,.b-current,.b-completed{background:var(--ok-bg);color:var(--ok)}
.b-observe,.b-pending,.b-review{background:var(--warn-bg);color:var(--warn)}
.b-followup,.b-under,.b-scheduled{background:var(--info-bg);color:var(--info)}
.b-action,.b-expired,.b-danger{background:var(--danger-bg);color:var(--danger)}
.b-routine,.b-draft,.b-cancelled{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.b-review-due{background:#FCE7F3;color:#9D174D}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:flex-start;gap:12px;padding:12px;text-align:left;width:100%}
.li-ic{width:36px;height:36px;border-radius:var(--rs);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.li-bd{flex:1;min-width:0}.li-t{font-weight:550;font-size:.875rem}.li-m{font-size:.75rem;color:var(--muted);margin-top:2px}.li-r{flex-shrink:0}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:.875rem}
.search{display:flex;gap:8px;margin-bottom:12px}.search .fc{flex:1}
.rcard{display:flex;align-items:center;gap:12px;padding:12px}
.rav{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:.85rem;flex-shrink:0}
.ri{flex:1;min-width:0}.ri .name{font-weight:600;font-size:.9rem}.ri .meta{font-size:.75rem;color:var(--muted);margin-top:2px}.ri .alerts{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.rhead{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rh-top{display:flex;gap:12px;margin-bottom:12px}
.rh-av{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:1rem;flex-shrink:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.8rem}.flab{color:var(--muted);font-size:.7rem}.fval{font-weight:500;margin-top:1px}
.ractions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.tabs-sc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.tabs-sc::-webkit-scrollbar{display:none}.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);min-width:max-content}
.tab{padding:10px 12px;font-size:.8rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;min-height:40px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.prog{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.prog-b{height:100%;background:var(--accent);border-radius:4px}
.overlay{position:fixed;inset:0;background:rgba(31,42,46,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.overlay.open{opacity:1;visibility:visible}
.sheet{background:var(--surface);border-radius:12px 12px 0 0;width:100%;max-width:560px;max-height:min(92vh,92dvh);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:var(--safe-b)}
.overlay.open .sheet{transform:translateY(0)}
.sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}.sh h2{flex:1;font-size:1rem}
.sb{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sf{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}.sf .btn{flex:1;min-width:110px}
.toast-w{position:fixed;top:calc(12px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:400px;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:var(--r);font-size:.85rem;box-shadow:var(--shadow-md);pointer-events:auto}
.toast.ok{background:var(--ok)}.toast.warn{background:var(--warn)}
.confirm{background:var(--ok-bg);border:1px solid #A7F3D0;border-radius:var(--r);padding:14px;margin-top:12px}
.confirm h3{color:var(--ok);margin-bottom:6px}.confirm p{font-size:.85rem;margin-bottom:10px}.confirm .links{display:flex;flex-wrap:wrap;gap:8px}
.drow{display:flex;gap:8px;font-size:.85rem;padding:6px 0;border-bottom:1px solid var(--border)}.drow:last-child{border-bottom:none}
.dl{width:110px;flex-shrink:0;color:var(--muted);font-size:.8rem}.dv{flex:1;font-weight:500;word-break:break-word}
.note{padding:12px;border-left:3px solid var(--accent)}.note-m{display:flex;flex-wrap:wrap;gap:8px;font-size:.72rem;color:var(--muted);margin-bottom:6px}
.note-b{font-size:.85rem;white-space:pre-wrap}.note-f{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:.78rem}.nfl{color:var(--muted)}
.audit{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.8rem}.audit:last-child{border-bottom:none}
.adot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}.atime{color:var(--soft);font-size:.72rem;margin-top:2px}
.pbar{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}.pbar.routine{background:var(--border2)}.pbar.observe{background:var(--warn)}.pbar.action{background:var(--danger)}
.docph{background:var(--bg);border:1px dashed var(--border2);border-radius:var(--rs);padding:20px;font-size:.85rem;color:var(--muted);line-height:1.5;margin-top:12px}
.more-m{display:flex;flex-direction:column;gap:2px}
.more-m button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--rs);color:var(--text);font-size:.9rem;font-weight:500;min-height:44px;text-align:left;width:100%}
.more-m button:hover{background:var(--bg)}.more-m svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}
.gap-2{gap:8px}.flex{display:flex}.flex-wrap{flex-wrap:wrap}.items-c{align-items:center}.just-b{justify-content:space-between}
.muted{color:var(--muted)}.sm{font-size:.8rem}.fw{font-weight:600}
@media(min-width:768px){
.sidebar{display:flex}.bnav{display:none}.main{padding-bottom:0}.page-foot{padding-bottom:24px}
.tiles{grid-template-columns:repeat(4,1fr)}.facts{grid-template-columns:repeat(4,1fr)}
.overlay{align-items:center;padding:24px}
.sheet{border-radius:var(--r);max-height:90vh;transform:translateY(12px) scale(.98);opacity:0}
.overlay.open .sheet{transform:translateY(0) scale(1);opacity:1}
.content{padding:24px}.d2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
}

</style>
</head>
<body>
<div class="app" id="app">

    <header class="topbar" id="topbar"></header>

</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true">

    <div class="sf" id="sheet-footer"></div>
  </div>
</div>
<div class="toast-w" id="toast-wrap"></div>
<script>
(function(){
'use strict';
const I={

users:'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>',

settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>',

clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};
const STAFF=[{id:'ann',name:'Ann',role:'Administrator/Manager',initials:'AN'},{id:'harun',name:'Harun',role:'Caregiver',initials:'HA'},{id:'loice',name:'Loice',role:'Caregiver',initials:'LO'}];
const SHIFTS=['Morning','Evening','Night'];
const KEY='bhdc_demo_v1';
function uid(){return 'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDaysISO(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){if(!iso)return'';const[y,m,dd]=iso.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function fmtShort(iso){if(!iso)return'';const[y,m,dd]=iso.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function fmtTime(ts){return new Date(ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function fmtTO(t){if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';return (h%12||12)+':'+String(m).padStart(2,'0')+' '+ap}
function sn(id){const s=STAFF.find(x=>x.id===id);return s?s.name:id}

let store=null;
function loadStore(){try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.version===1&&p.residents){store=p;return}}}catch(e){}store=buildSeed();persist()}

function addAudit(text,actorId){store.audit.unshift({id:uid(),at:Date.now(),actorId:actorId||store.currentUserId,text});if(store.audit.length>200)store.audit.length=200}
function getResident(id){return store.residents.find(r=>r.id===id)}
function getDocStats(){
  const today=todayISO(),expected=[],completedKeys=new Set();
  store.residents.forEach(r=>SHIFTS.forEach(s=>expected.push({residentId:r.id,shift:s})));
  store.careNotes.filter(n=>n.date===today).forEach(n=>completedKeys.add(n.residentId+'|'+n.shift));
  const completed=expected.filter(e=>completedKeys.has(e.residentId+'|'+e.shift));
  const due=expected.filter(e=>!completedKeys.has(e.residentId+'|'+e.shift));
  return{expected:expected.length,completed:completed.length,due:due.length,dueList:due};
}
function getUpcoming(){const t=todayISO();return store.appointments.filter(a=>a.status==='Scheduled'&&a.date>=t)}
function getOpenHO(){return store.handovers.filter(h=>!h.resolved)}
function getPendingInc(){return store.incidents.filter(i=>i.reviewStatus==='Pending Review'||i.reviewStatus==='Under Review')}
function getOpenFU(){return store.careNotes.filter(n=>n.followUpRequired&&!n.followUpResolved)}
function getCPReviews(){return store.residents.filter(r=>r.carePlanStatus==='Review due')}
function getActions(){
  const items=[],today=todayISO(),tomorrow=addDaysISO(1),stats=getDocStats();
  stats.dueList.forEach(d=>{const r=getResident(d.residentId);items.push({title:r.label+' — '+d.shift.toLowerCase()+' documentation required',meta:'Due today · '+r.room,pri:d.shift==='Evening'&&d.residentId==='B'?1:3,href:'#/document-care?resident='+d.residentId+'&shift='+encodeURIComponent(d.shift),icon:'clipboard'})});
  getUpcoming().filter(a=>a.date===tomorrow||a.date===today).forEach(a=>{const r=getResident(a.residentId);items.push({title:r.label+' — appointment '+(a.date===today?'today':'tomorrow'),meta:fmtTO(a.time)+' · '+a.type,pri:a.date===tomorrow?2:1,href:'#/appointments?id='+a.id,icon:'calendar'})});
  getCPReviews().forEach(r=>items.push({title:r.label+' — care-plan review approaching',meta:r.room+' · Review due',pri:2,href:'#/residents/'+r.id+'?tab=careplan',icon:'file'}));
  getPendingInc().filter(i=>i.reviewStatus==='Pending Review').forEach(i=>{const r=getResident(i.residentId);items.push({title:'Incident — management review required',meta:r.label+' · '+i.type,pri:1,href:'#/incidents?id='+i.id,icon:'alert'})});

  let list=store.residents;
  if(q)list=list.filter(r=>r.label.toLowerCase().includes(q)||r.room.toLowerCase().includes(q)||r.status.toLowerCase().includes(q)||(r.alerts||[]).some(a=>a.toLowerCase().includes(q)));
  let html='<div class="search"><input class="fc" type="search" id="resident-search" placeholder="Search by label, room, status…" value="'+esc(route.params.q||'')+'" autocomplete="off"></div><div class="list">';
  if(!list.length)html+='<div class="card"><div class="empty">No residents match</div></div>';
  else list.forEach(r=>{html+='<button class="card card-click rcard" type="button" data-nav="#/residents/'+r.id+'"><div class="rav">'+r.id+'</div><div class="ri"><div class="name">'+esc(r.label)+'</div><div class="meta">'+esc(r.room)+' · '+badge(r.status)+'</div>'+(r.alerts&&r.alerts.length?'<div class="alerts">'+r.alerts.map(a=>'<span class="badge b-observe">'+esc(a)+'</span>').join('')+'</div>':'')+'</div>'+I.chevron+'</button>'});
  return html+'</div>';
}

function viewAppointments(route){
  const filter=route.params.filter||'upcoming',today=todayISO(),all=store.appointments;
  const counts={today:all.filter(a=>a.date===today&&a.status==='Scheduled').length,upcoming:all.filter(a=>a.status==='Scheduled'&&a.date>=today).length,completed:all.filter(a=>a.status==='Completed').length,cancelled:all.filter(a=>a.status==='Cancelled').length};
  let list=all;
  if(filter==='today')list=all.filter(a=>a.date===today&&a.status==='Scheduled');
  else if(filter==='upcoming')list=all.filter(a=>a.status==='Scheduled'&&a.date>=today);
  else if(filter==='completed')list=all.filter(a=>a.status==='Completed');
  else if(filter==='cancelled')list=all.filter(a=>a.status==='Cancelled');
  list=list.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(filter==='completed'||filter==='cancelled')list.reverse();
  let html='<div class="seg mb-3">'+['today','upcoming','completed','cancelled'].map(f=>'<button type="button" class="'+(filter===f?'active':'')+'" data-nav="#/appointments?filter='+f+'">'+f.charAt(0).toUpperCase()+f.slice(1)+'<span class="sc">'+counts[f]+'</span></button>').join('')+'</div>';
  html+='<button class="btn btn-p btn-block mb-3" type="button" data-action="add-appointment">'+I.plus+' Add Appointment</button>';
  if(!list.length)html+='<div class="card"><div class="empty">'+I.calendar+'No appointments in this view</div></div>';
  else{html+='<div class="list">';list.forEach(a=>{html+=apptCard(a)});html+='</div>'}
  return html;
}
function viewHandover(){
  const open=store.handovers.filter(h=>!h.resolved).sort((a,b)=>b.createdAt-a.createdAt);
  const resolved=store.handovers.filter(h=>h.resolved).sort((a,b)=>(b.resolvedAt||0)-(a.resolvedAt||0));
  let html='<button class="btn btn-p btn-block mb-3" type="button" data-action="add-handover">'+I.plus+' Add Handover Item</button>';
  html+='<div class="sec"><h2>Open</h2><span class="count">'+open.length+'</span></div>';
  if(!open.length)html+='<div class="card"><div class="empty">No open handover items</div></div>';
  else{html+='<div class="list">';open.forEach(h=>{html+=handoverCard(h)});html+='</div>'}
  html+='<div class="sec"><h2>Resolved</h2><span class="count">'+resolved.length+'</span></div>';
  if(!resolved.length)html+='<div class="card"><div class="empty">None resolved yet</div></div>';
  else{html+='<div class="list">';resolved.slice(0,10).forEach(h=>{html+=handoverCard(h)});html+='</div>'}
  return html;
}
function viewIncidents(route){
  let html='<button class="btn btn-p btn-block mb-3" type="button" data-action="report-incident">'+I.plus+' Report Incident</button>';
  const list=store.incidents.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(!list.length)html+='<div class="card"><div class="empty">No incidents</div></div>';
  else{html+='<div class="list">';list.forEach(i=>{html+=incidentCard(i)});html+='</div>'}
  return html;
}
function viewManagement(route){
  const stats=getDocStats(),pct=Math.round((stats.completed/stats.expected)*100);
  const missing={};stats.dueList.forEach(d=>{if(!missing[d.residentId])missing[d.residentId]=[];missing[d.residentId].push(d.shift)});
  const upcoming=getUpcoming(),ho=getOpenHO(),inc=getPendingInc(),fu=getOpenFU(),rev=getCPReviews();
  const docStatus={Current:0,'Review due':0,Expired:0,Draft:0};store.documents.forEach(d=>{if(docStatus[d.status]!=null)docStatus[d.status]++});
  let html='<div class="card card-pad mb-3"><h3 class="mb-2">Documentation completion</h3><div class="flex just-b sm mb-2"><span>'+stats.completed+' of '+stats.expected+' today</span><span class="fw">'+pct+'%</span></div><div class="prog"><div class="prog-b" style="width:'+pct+'%"></div></div></div><div class="d2">';
  html+='<div class="card card-pad mb-3"><h3 class="mb-3">Residents missing documentation</h3>';

  html+='</div><div class="card card-pad mb-3"><h3 class="mb-3">Open incidents</h3>';
  if(!inc.length)html+='<div class="sm muted">None open</div>';else inc.forEach(i=>{html+=incidentCard(i)});

  if(!ho.length)html+='<div class="sm muted">None open</div>';else ho.forEach(h=>{const r=getResident(h.residentId);html+='<button class="card card-click li mb-2" type="button" data-nav="#/handover" style="border:1px solid var(--border)"><div class="li-bd"><div class="li-t">'+esc(r.label)+' · '+badge(h.priority)+'</div><div class="li-m">'+esc(h.message.slice(0,80))+(h.message.length>80?'…':'')+'</div></div></button>'});
  html+='</div><div class="card card-pad mb-3"><h3 class="mb-3">Upcoming appointments</h3>';
  if(!upcoming.length)html+='<div class="sm muted">None scheduled</div>';else upcoming.slice(0,5).forEach(a=>{html+=apptCard(a)});
  html+='</div></div>';
  html+='<div class="card card-pad mb-3" id="mgmt-followups"><h3 class="mb-3">Overdue / outstanding follow-ups</h3>';
  if(!fu.length)html+='<div class="sm muted">No outstanding follow-ups</div>';

  html+='</div><div class="card card-pad mb-3" id="mgmt-careplans"><h3 class="mb-3">Care-plan reviews due</h3>';

function handleAction(action,el){
  const id=el.getAttribute('data-id'),resident=el.getAttribute('data-resident');
  switch(action){
    case 'cf-shift':{
      const seg=document.getElementById('cf-shift-seg');
      if(seg){seg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('cf-shift').value=el.getAttribute('data-shift');
      const sg=document.getElementById('cf-sleep-group');if(sg){sg.style.outline=el.getAttribute('data-shift')==='Night'?'2px solid var(--accent-soft)':'none';sg.style.borderRadius='6px';sg.style.padding=el.getAttribute('data-shift')==='Night'?'8px':'0'}}
      break}
    case 'cf-changes':{
      const seg=document.getElementById('cf-changes-seg');
      if(seg){seg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('cf-changes').value=el.getAttribute('data-val');document.getElementById('cf-changes-detail-wrap').classList.toggle('hidden',el.getAttribute('data-val')!=='Yes')}
      break}
    case 'sheet-cancel':closeSheet();break;
    case 'open-more':navigate('#/more');break;
    case 'reset-demo':confirmDialog('Reset all demo data to the original seed? Unsaved demo changes will be lost.',()=>{resetStore();toast('Demo data restored','ok');navigate('#/dashboard')});break;
    case 'add-appointment':closeSheet();showAppointmentForm(null,resident);break;
    case 'edit-appointment':{const a=store.appointments.find(x=>x.id===id);closeSheet();showAppointmentForm(a);break}
    case 'view-appointment':showAppointmentDetail(id);break;
    case 'complete-appointment':{const a=store.appointments.find(x=>x.id===id);if(a){a.status='Completed';addAudit(sn(store.currentUserId)+' marked an appointment completed for '+getResident(a.residentId).label);toast('Appointment marked completed','ok');closeSheet();persist();render()}break}
    case 'cancel-appointment':{const a=store.appointments.find(x=>x.id===id);if(a){a.status='Cancelled';addAudit(sn(store.currentUserId)+' cancelled an appointment for '+getResident(a.residentId).label);toast('Appointment cancelled','ok');closeSheet();persist();render()}break}
    case 'reschedule-appointment':{const a=store.appointments.find(x=>x.id===id);if(a){a.status='Scheduled';addAudit(sn(store.currentUserId)+' rescheduled an appointment for '+getResident(a.residentId).label);toast('Appointment set to Scheduled','ok');closeSheet();persist();render()}break}
    case 'report-incident':closeSheet();showIncidentForm(resident);break;
    case 'view-incident':showIncidentDetail(id);break;
    case 'set-incident-status':{const i=store.incidents.find(x=>x.id===id);const status=el.getAttribute('data-status');if(!i)break;if(status==='Closed'){showCloseIncidentSheet(i);break}i.reviewStatus=status;i.reviewedBy=store.currentUserId;i.reviewedAt=Date.now();addAudit(sn(store.currentUserId)+' reviewed an incident for '+getResident(i.residentId).label+' — '+status);toast('Incident status: '+status,'ok');closeSheet();persist();render();break}
    case 'add-handover':closeSheet();showHandoverForm(resident);break;
    case 'resolve-handover':{const h=store.handovers.find(x=>x.id===id);if(h){h.resolved=true;h.resolvedBy=store.currentUserId;h.resolvedAt=Date.now();addAudit(sn(store.currentUserId)+' marked a handover item resolved for '+getResident(h.residentId).label);toast('Handover item resolved','ok');persist();render()}break}
    case 'reopen-handover':{const h=store.handovers.find(x=>x.id===id);if(h){h.resolved=false;h.resolvedBy=null;h.resolvedAt=null;addAudit(sn(store.currentUserId)+' reopened a handover item for '+getResident(h.residentId).label);toast('Handover item reopened','ok');persist();render()}break}
    case 'add-document':closeSheet();showDocumentForm(resident);break;
    case 'view-document':showDocumentDetail(id);break;
    case 'resolve-followup':{const n=store.careNotes.find(x=>x.id===id);if(n){n.followUpResolved=true;addAudit(sn(store.currentUserId)+' resolved a follow-up for '+getResident(n.residentId).label);toast('Follow-up resolved','ok');persist();render()}break}
  }
}
function submitCareNote(form){
  form.querySelectorAll('.ferr').forEach(el=>{el.classList.add('hidden');el.textContent=''});
  const fd=new FormData(form),shift=document.getElementById('cf-shift').value,errors={};
  if(!fd.get('residentId'))errors.residentId='Select a resident';
  if(!shift)errors.shift='Select a shift';
  if(!fd.get('meals'))errors.meals='Required';
  if(!fd.get('fluid'))errors.fluid='Required';
  if(!fd.get('toileting'))errors.toileting='Required';
  if(!fd.get('bathing'))errors.bathing='Required';
  if(!fd.get('mobility'))errors.mobility='Required';
  if(!fd.get('mood'))errors.mood='Required';
  if(!(fd.get('narrative')||'').trim())errors.narrative='Narrative notes are required';
  if(Object.keys(errors).length){Object.keys(errors).forEach(k=>{const el=form.querySelector('[data-err="'+k+'"]');if(el){el.textContent=errors[k];el.classList.remove('hidden')}});toast('Please complete required fields','warn');return}
  const r=getResident(fd.get('residentId'));
  const note={id:uid(),residentId:fd.get('residentId'),caregiverId:fd.get('caregiverId'),shift,date:todayISO(),meals:fd.get('meals'),fluid:fd.get('fluid'),toileting:fd.get('toileting'),bathing:fd.get('bathing'),mobility:fd.get('mobility'),activities:fd.get('activities')||'',mood:fd.get('mood'),sleep:fd.get('sleep')||'',changesBaseline:document.getElementById('cf-changes').value,changesDetail:fd.get('changesDetail')||'',followUpRequired:document.getElementById('cf-fu').checked,followUpDetail:fd.get('followUpDetail')||'',followUpDue:fd.get('followUpDue')||'',followUpResolved:false,narrative:fd.get('narrative'),createdAt:Date.now(),authorId:fd.get('caregiverId')};
  store.careNotes.unshift(note);
  addAudit(sn(note.authorId)+' documented care for '+r.label+' ('+shift+')');
  if(note.followUpRequired)addAudit(sn(note.authorId)+' created a follow-up for '+r.label);
  persist();
  form.classList.add('hidden');
  const confirm=document.getElementById('care-confirm');
  confirm.classList.remove('hidden');
  confirm.innerHTML='<div class="confirm"><h3>Care note saved</h3><p>Documentation for '+esc(r.label)+' · '+esc(shift)+' has been recorded'+(note.followUpRequired?' with a follow-up alert':'')+'.</p><div class="links"><button class="btn btn-p btn-sm" type="button" data-nav="#/residents/'+r.id+'?tab=notes">View in '+esc(r.label)+'\'s Daily Notes</button><button class="btn btn-s btn-sm" type="button" data-nav="#/dashboard">Back to Dashboard</button><button class="btn btn-g btn-sm" type="button" data-nav="#/document-care">Document another</button></div></div>';
  toast('Care note submitted','ok');
  renderSidebar(parseHash());renderBottomNav(parseHash());
}
function bindCareFormExtras(){
  const seg=document.getElementById('cf-shift-seg');
  if(seg)seg.querySelectorAll('button').forEach(btn=>{btn.onclick=()=>{seg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('cf-shift').value=btn.getAttribute('data-shift');const sg=document.getElementById('cf-sleep-group');if(sg){sg.style.outline=btn.getAttribute('data-shift')==='Night'?'2px solid var(--accent-soft)':'none';sg.style.borderRadius='6px';sg.style.padding=btn.getAttribute('data-shift')==='Night'?'8px':'0'}}});
  const chSeg=document.getElementById('cf-changes-seg');
  if(chSeg)chSeg.querySelectorAll('button').forEach(btn=>{btn.onclick=()=>{chSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('cf-changes').value=btn.getAttribute('data-val');document.getElementById('cf-changes-detail-wrap').classList.toggle('hidden',btn.getAttribute('data-val')!=='Yes')}});
}
function bindGlobalEvents(){
  document.getElementById('sheet-close').onclick=()=>closeSheet();
  document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('overlay').classList.contains('open'))closeSheet()});
  document.body.addEventListener('click',e=>{
    const t=e.target.closest('[data-nav]');
    if(t){e.preventDefault();closeSheet();navigate(t.getAttribute('data-nav'));return}
    const actionEl=e.target.closest('[data-action]');
    if(actionEl)handleAction(actionEl.getAttribute('data-action'),actionEl);
  });
  document.body.addEventListener('change',e=>{
    if(e.target.id==='user-select'){store.currentUserId=e.target.value;persist();toast('Viewing as '+sn(store.currentUserId));render()}
    if(e.target.id==='cf-fu')document.getElementById('cf-fu-wrap').classList.toggle('hidden',!e.target.checked);
  });
  document.body.addEventListener('input',e=>{
    if(e.target.id==='resident-search'){clearTimeout(window._searchT);window._searchT=setTimeout(()=>{const q=e.target.value;const route=parseHash();if(route.parts[0]==='residents'&&!route.parts[1]){history.replaceState(null,'','#/residents'+(q?'?q='+encodeURIComponent(q):''));document.getElementById('content').innerHTML=viewResidents(parseHash())}},150)}
  });
  document.body.addEventListener('submit',e=>{if(e.target.id==='care-form'){e.preventDefault();submitCareNote(e.target)}});
}
function render(){
  const route=parseHash();
  renderSidebar(route);renderBottomNav(route);renderTopbar(route);
  const page=route.parts[0]||'dashboard';
  let html='';
  if(page==='dashboard'||page==='')html=viewDashboard();
  else if(page==='residents'&&route.parts[1])html=viewResidentDetail(route);
  else if(page==='residents')html=viewResidents(route);
  else if(page==='document-care')html=viewDocumentCare(route);
  else if(page==='appointments')html=viewAppointments(route);
  else if(page==='handover')html=viewHandover();
  else if(page==='incidents')html=viewIncidents(route);
  else if(page==='management')html=viewManagement(route);
  else if(page==='more')html=viewMore();
  else html=viewDashboard();
  document.getElementById('content').innerHTML=html;
  if(page==='document-care')bindCareFormExtras();
  if(page==='appointments'&&route.params.id){const a=store.appointments.find(x=>x.id===route.params.id);if(a)setTimeout(()=>showAppointmentDetail(a.id),100)}
  if(page==='incidents'&&route.params.id){const i=store.incidents.find(x=>x.id===route.params.id);if(i)setTimeout(()=>showIncidentDetail(i.id),100)}
}
loadStore();
bindGlobalEvents();
window.addEventListener('hashchange',()=>render());
if(!location.hash)location.hash='#/dashboard';
else render();
})();

</script>
</body>
</html>
